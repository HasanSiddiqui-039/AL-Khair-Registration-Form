<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIT Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>AIT Student Registration</h1>
    <p>Enter your information below to register.</p>

    <img src="images.png" alt="AIT Logo" width="200">
      <form id="regForm">
        
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
        <small id="fullName-error"></small>
    
        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="name@example.com" required>
        <small id="email-error"></small>
    
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" placeholder="03XX-XXXXXXX" required>
        <small id="phone-error"></small>
    
        <label for="course">Course of Interest:</label>
        <select id="course" required>
            <option value="">Select course</option>
            <option>Computer Information Technology</option>
            <option>Web Development</option>
            <option>Digital Marketing</option>
            <option>Computer Operator</option>
        </select>
        <small id="course-error"></small>
    
        <label for="gender">Gender:</label>
        <select id="gender" required>
            <option value="">Select gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>
        <small id="gender-error"></small>
    
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>
        <small id="dob-error"></small>
    
        <label for="address">Address:</label>
        <input type="text" id="address" placeholder="Enter your address">
        <small id="address-error"></small>
    
        <label for="city">City:</label>
        <select id="city" required>
            <option value="">Select city</option>
            <option>Karachi</option>
            <option>Lahore</option>
            <option>Islamabad</option>
            <option>Quetta</option>
            <option>Peshawar</option>
        </select>
        <small id="city-error"></small>
    
        <label>
            <input type="checkbox" id="terms" required>
            I agree to the registration terms.
        </label>
        <small id="terms-error"></small>
    
        <button type="submit">Register Student</button>
        <p id="message"></p>
      </form>

    <button type="button" id="openDashboard">Open Student Dashboard</button>
      <section id="dashboardSection" hidden>
        <hr>
        <h1>Student Dashboard</h1>
        <div class="stats">
            <div class="stat-card">
                <span>Total Students</span>
                <strong id="total">0</strong>
            </div>
            <div class="stat-card">
                <span>Registered Students</span>
                <strong id="registered">0</strong>
            </div>
        </div>
        <div class="table-box">
            <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Gender</th>
                    <th>Date of Birth</th>
                    <th>Address</th>
                    <th>City</th>
                    <th>Action</th>
                  </tr>
                </thead>

                <tbody id="studentRows"></tbody>
            </table>
        </div>
        <div class="dashboard-buttons">
            <button type="button" id="backToForm">Back to Registration</button>
            <button type="button" id="clearBtn" class="delete">Clear All</button>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
